[project]
name = "relay-hackathon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.27", "twilio>=9", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
