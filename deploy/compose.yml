services:
  gateway:
    build: ..
    env_file: ../.env
    environment:
      RELAY_DB: /data/relay.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - relay-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set a named Cloudflare tunnel token}
    restart: unless-stopped
volumes:
  relay-data:
